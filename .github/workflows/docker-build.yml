name: Docker Build and Push

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  build-shell:
    name: Build NapCat.Shell
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 20.x
        uses: actions/setup-node@v6
        with:
          node-version: 20.x

      - name: Install pnpm
        run: npm i -g pnpm

      - name: Install dependencies
        run: pnpm i

      - name: Build frontend
        run: pnpm --filter napcat-webui-frontend run build || exit 1

      - name: Build shell
        run: pnpm run build:shell

      - name: Build builtin plugin
        run: pnpm --filter napcat-plugin-builtin run build || exit 1

      - name: Prepare shell dist
        run: |
          cd packages/napcat-shell/dist
          npm install --omit=dev
          rm ./package-lock.json || exit 0

      - name: Zip shell
        run: |
          cd packages/napcat-shell/dist
          zip -qr ../../../NapCat.Shell.zip .

      - name: Upload NapCat.Shell.zip
        uses: actions/upload-artifact@v6
        with:
          name: NapCat.Shell.zip
          path: NapCat.Shell.zip

  docker:
    needs: build-shell
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download NapCat.Shell.zip
        uses: actions/download-artifact@v7
        with:
          name: NapCat.Shell.zip
          path: .

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
